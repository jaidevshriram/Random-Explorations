<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><a href="index.html">Scenes</a><a href="arena.html">Arena</a><a class="on" href="standing.html">Still Standing</a></nav>
<div class="stage"><canvas id="c"></canvas></div>
<div id="ui"></div>
<script src="common.js"></script>
<script>
(() => {
  const W = 1920, H = 1080, TAU = CS.TAU;
  // Layout, adapted from the portrait painting to 16:9.
  const DISC = { x: 690, y: -44, r: 172 };
  const APEX = { x: 690, y: 127, w: 10 };
  const BASE = { y: 792, l: 590, r: 782 };           // left edge leans out a little more
  const BCX = (BASE.l + BASE.r) / 2;
  const STAGE = { x: 684, y: 797, rx: 250, ry: 13 };
  const PERF = { x: 660, y: 795, s: 1.74 };
  const LIGHT = { x: 686, y: 770 };                  // where the crowd's rim light comes from
  const HALO = { x: 300, y: 0, w: 780, h: 960 };     // box of the pre-blurred beam halo
  const FARY = 760;                                   // top of the baked far-crowd strip
  const RAYBOX = { x: 580, y: 120, w: 214, h: 680 }; // box around the cone
  const R = CS.rng(23);
  const rr = (a, b) => a + (b - a) * R();

  let bg, smokeA, smokeB, smokeC, farCrowd, halo, overlay, glowCyan, glowSoft, glowDot, people = [], wisps = [], motes = [], rays = [];
  let lyric = new URLSearchParams(location.search).get('lyric') || 'But I am still standing';

  // Tileable domain-warped fbm smoke: mid teal, dark blue-grey swirls, a few pale wisps.
  function makeSmoke(seed, size, contrast, alphaMode) {
    const c = CS.canvas(size, size), g = c.getContext('2d');
    const id = g.createImageData(size, size), d = id.data;
    const n = CS.noise2(seed), n2 = CS.noise2(seed + 5), n3 = CS.noise2(seed + 9);
    const P = 5; // lattice period at the base octave → seamless in x and y
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const X = (x / size) * P, Y = (y / size) * P;
        const qx = CS.fbm(n2, X, Y, 4, P), qy = CS.fbm(n3, X + 3.1, Y + 1.7, 4, P);
        const v = CS.fbm(n, X + qx * 2.6, Y + qy * 2.6, 5, P);
        const k = CS.clamp((v - 0.5) * contrast + 0.5, 0, 1);
        const i = (y * size + x) * 4;
        if (alphaMode) {
          // pale wisps only: transparent except where the field peaks
          const a = CS.smooth(0.55, 0.85, k);
          d[i] = 150; d[i + 1] = 235; d[i + 2] = 230; d[i + 3] = a * 255;
        } else {
          const m = CS.smooth(0.18, 0.6, k), hi = CS.smooth(0.66, 0.95, k);
          d[i] = CS.lerp(CS.lerp(16, 36, m), 110, hi);
          d[i + 1] = CS.lerp(CS.lerp(52, 152, m), 222, hi);
          d[i + 2] = CS.lerp(CS.lerp(78, 164, m), 220, hi);
          d[i + 3] = 255;
        }
      }
    }
    g.putImageData(id, 0, 0);
    return c;
  }

  function buildBackground() {
    const c = CS.canvas(W, H), g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#01040c');
    gr.addColorStop(0.45, '#020613');
    gr.addColorStop(0.8, '#01050f');
    gr.addColorStop(1, '#01030a');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);

    // The far stands: rows of tiny dim faces, patchy, then blurred into soft dabs.
    const st = CS.canvas(W, H), s = st.getContext('2d');
    const dab = CS.glow(60, 140, 150, 32, 0.3);
    const n = CS.noise2(31);
    for (const [top, bot, sag] of [[150, 300, 26], [410, 590, 20]]) {
      for (let y = top; y < bot; y += 6) {
        for (let x = 0; x < W; x += rr(5, 11)) {
          const u = (x - W / 2) / (W / 2);
          const yy = y - sag * u * u + rr(-2, 2);
          const patch = CS.fbm(n, x / 150, yy / 60, 3);
          const edge = CS.smooth(top, top + 35, y) * (1 - CS.smooth(bot - 45, bot, y));
          const spill = 1 + 0.9 * Math.exp(-Math.abs(x - BCX) / 260);   // lit a bit more near the beam
          const a = CS.smooth(0.36, 0.7, patch) * edge * rr(0.2, 1) * Math.pow(1 - 0.75 * Math.abs(u), 1.3) * spill;
          if (a < 0.04) continue;
          s.globalAlpha = Math.min(1, a * 0.6);
          const z = rr(4, 8);
          s.drawImage(dab, x - z, yy - z, z * 2, z * 2);
        }
      }
    }
    g.filter = 'blur(2.5px)';
    g.drawImage(st, 0, 0);
    g.filter = 'none';

    // haze hanging at stage height, lit by the beam, so near heads silhouette against it
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.translate(BCX, STAGE.y - 10);
    g.scale(1, 0.16);
    const hz = g.createRadialGradient(0, 0, 0, 0, 0, 900);
    hz.addColorStop(0, 'rgba(30,95,105,0.22)');
    hz.addColorStop(0.35, 'rgba(18,60,72,0.12)');
    hz.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hz;
    g.fillRect(-900, -900, 1800, 1800);
    g.restore();
    return c;
  }

  // Soft scatter around the cone, blurred once at init.
  function buildHalo() {
    const c = CS.canvas(HALO.w, HALO.h), g = c.getContext('2d');
    const tmp = CS.canvas(HALO.w, HALO.h), t = tmp.getContext('2d');
    t.translate(-HALO.x, -HALO.y);
    tracePoly(t, beamPoly(0));
    const gr = t.createLinearGradient(0, APEX.y, 0, BASE.y);
    gr.addColorStop(0, 'rgba(70,200,205,0.9)');
    gr.addColorStop(0.5, 'rgba(40,150,160,0.55)');
    gr.addColorStop(1, 'rgba(50,170,175,0.8)');
    t.fillStyle = gr;
    t.fill();
    t.lineWidth = 30;
    t.strokeStyle = 'rgba(60,180,185,0.5)';
    t.stroke();
    // wide faint pass + tighter pass for a halo that hugs the edges
    g.filter = 'blur(60px)';
    g.globalAlpha = 0.9;
    g.drawImage(tmp, 0, 0);
    g.filter = 'blur(14px)';
    g.globalAlpha = 0.45;
    g.drawImage(tmp, 0, 0);
    g.filter = 'none';
    g.globalAlpha = 1;
    return c;
  }

  function buildPeople() {
    const startY = x => 870 - 60 * CS.smooth(900, 1010, x);   // empty band in front/left of the stage
    const radius = y => 4.5 + 66 * Math.pow(CS.clamp((y - 800) / 280, 0, 2), 1.75);
    // dart throwing in depth bands: random placement, rejected if it would sit inside a neighbour
    const grid = new Map(), CELL = 60;
    const key = (cx, cy) => cx * 1000 + cy;
    const near = (x, y, r) => {
      const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL), k = Math.ceil(r * 1.6 / CELL);
      for (let i = -k - 1; i <= k + 1; i++) for (let j = -k - 1; j <= k + 1; j++) {
        for (const q of grid.get(key(cx + i, cy + j)) || []) {
          const m = Math.min(r, q.r);
          if (Math.abs(q.x - x) < (r + q.r) * 0.62 && Math.abs(q.y - y) < m * 0.9) return true;
        }
      }
      return false;
    };
    for (let y0 = 806; y0 < 1250;) {
      const band = radius(y0) * 0.9;
      const tries = Math.ceil((W + 160) / radius(y0 + band / 2) * 1.6);
      for (let n = 0; n < tries; n++) {
        const y = y0 + R() * band, x = rr(-80, W + 80);
        if (y < startY(x) + rr(-8, 8)) continue;
        const r = radius(y) * rr(0.8, 1.2);
        if (near(x, y, r)) continue;
        const L = R();
        const p = {
          x, y, r,
          ph: rr(0, TAU), f: rr(0.6, 1.4), hair: R(), jit: [R(), R(), R(), R(), R()],
          fill: `rgb(${L * 1.5 | 0},${2 + L * 3 | 0},${5 + L * 6 | 0})`,
          lift: R() < 0.3 ? rr(0.05, 0.35) : rr(0.5, 1.2),
          sh: rr(1.6, 2.1), ax: rr(0.74, 0.88), tilt: rr(-0.12, 0.12),
        };
        people.push(p);
        const k = key(Math.floor(x / CELL), Math.floor(y / CELL));
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(p);
      }
      y0 += band;
    }
    // one big auburn head near the bottom right catching warm light
    let best = null;
    const d = p => Math.hypot(p.x - 1330, p.y - 1010);
    for (const p of people) if (p.r > 36 && p.r < 70 && (!best || d(p) < d(best))) best = p;
    if (best) { best.warm = true; best.hair = 0.9; best.lift = 1.3; }
    people.sort((a, b) => a.y - b.y);

    // nearer heads become baked, rim-lit people (the far ones stay pen-drawn fans)
    const B = CS.rng(91);
    for (const p of people) {
      if (p.r < 9) continue;
      Object.assign(p, {
        hw: 0.9 + B() * 0.2, sw: 1.9 + B() * 0.5, seed: (B() * 1e9) | 0, tilt: p.tilt,
        hair: p.warm ? 0.6 : B(), L: 0.04 + 0.07 * p.lift,
      });
      p.sprite = CS.bakePerson(p, {
        lx: LIGHT.x, ly: LIGHT.y - 60, rim: 0.6, rimMin: 0.1, falloff: 650,
        rimColor: p.warm ? '205,130,95' : '80,190,188', headL: 1, shirtL: 1.1,
        // warmth stays nearly neutral in this blue-black, except for the one auburn head
        tone: (L, w = 0) => { w = w >= 1.3 ? w : w * 0.15; return `rgb(${(1 + L * 14 + w * L * 60) | 0},${(4 + L * 30 + w * L * 14) | 0},${(12 + L * 40 - w * L * 20) | 0})`; },
      });
    }
  }
  const crowdOpts = { bob: 0.035, sway: 0.06, rimColor: '80,190,188' };
  const crowdLayer = CS.canvas(W, H);
  const drawCrowd = (g, t) => { for (const p of people) p.sprite ? CS.drawBaked(g, p, t, crowdOpts) : drawFan(g, p, t); };

  function init() {
    smokeA = makeSmoke(4, 384, 2.3, false);
    smokeB = makeSmoke(12, 256, 1.9, false);
    smokeC = makeSmoke(19, 256, 1.6, true);
    glowCyan = CS.glow(130, 245, 235, 128);
    glowSoft = CS.glow(60, 190, 190, 128, 0.4);
    glowDot = CS.glow(170, 250, 245, 16, 0.3);
    bg = buildBackground();
    halo = buildHalo();
    buildPeople();
    overlay = CS.paintOverlay(W, H, 8, { strokes: 30000, strength: 0.75, vignette: 0.7 });
    for (let i = 0; i < 16; i++) wisps.push({ x: rr(0, 2), s: rr(40, 120), ph: rr(0, TAU), sp: rr(0.04, 0.12) });
    for (let i = 0; i < 70; i++) motes.push({ u: rr(-1, 1), v: rr(0, 1), sp: rr(0.004, 0.018), ph: rr(0, TAU), z: rr(1.5, 4) });
    // three static fans of faint shafts, cross-faded at different rates so the light shimmers
    for (let k = 0; k < 3; k++) rays.push({ c: buildRays(), ph: rr(0, TAU), sp: rr(0.25, 0.55) });
    // far crowd barely moves at that size, so bake it once; only nearer heads are drawn per frame
    farCrowd = CS.canvas(W, H - FARY);
    const fg = farCrowd.getContext('2d');
    fg.translate(0, -FARY);
    for (const p of people) if (p.r < 12) drawFan(fg, p, 0);
    people = people.filter(p => p.r >= 12);
  }

  function buildRays() {
    const c = CS.canvas(RAYBOX.w, RAYBOX.h), g = c.getContext('2d');
    const poly = beamPoly(0);
    g.translate(-RAYBOX.x, -RAYBOX.y);
    tracePoly(g, poly);
    g.clip();
    for (let i = 0; i < 9; i++) {
      const [bx] = conePt(poly, rr(-1, 1), 1);
      const w = rr(3, 16), a = rr(0.025, 0.07);
      const gr = g.createLinearGradient(0, APEX.y, 0, BASE.y);
      gr.addColorStop(0, `rgba(160,245,240,${a * 1.6})`);
      gr.addColorStop(0.6, `rgba(140,235,230,${a * 0.6})`);
      gr.addColorStop(1, `rgba(150,240,235,${a})`);
      g.fillStyle = gr;
      g.beginPath();
      g.moveTo(APEX.x - 1, APEX.y); g.lineTo(APEX.x + 1, APEX.y);
      g.lineTo(bx + w / 2, BASE.y); g.lineTo(bx - w / 2, BASE.y);
      g.fill();
    }
    return c;
  }

  // beam outline at time t (very slight breathing so the cone feels alive)
  function beamPoly(t) {
    const b = 1 + Math.sin(t * 0.7) * 0.005;
    return [
      [APEX.x - APEX.w / 2, APEX.y], [APEX.x + APEX.w / 2, APEX.y],
      [BCX + (BASE.r - BCX) * b, BASE.y], [BCX + (BASE.l - BCX) * b, BASE.y],
    ];
  }
  const tracePoly = (g, p) => { g.beginPath(); p.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); };
  // point inside the cone: u in [-1,1] across, v in [0,1] from apex to base
  const conePt = (poly, u, v) => {
    const lx = CS.lerp(poly[0][0], poly[3][0], v), rx = CS.lerp(poly[1][0], poly[2][0], v);
    return [CS.lerp(lx, rx, (u + 1) / 2), CS.lerp(APEX.y, BASE.y, v)];
  };

  function drawBeam(g, t, I) {
    const poly = beamPoly(t);
    const flick = 0.94 + 0.06 * Math.sin(t * 3.7) * Math.sin(t * 1.3 + 1);

    // scatter: the beam lighting the haze around it
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = Math.min(1, 0.32 * I * flick);
    g.drawImage(halo, HALO.x, HALO.y);
    g.globalAlpha = 1;

    // smoke body, clipped to the cone
    g.globalCompositeOperation = 'source-over';
    g.save();
    tracePoly(g, poly);
    g.clip();
    const pa = g.createPattern(smokeA, 'repeat'), pb = g.createPattern(smokeB, 'repeat'), pc = g.createPattern(smokeC, 'repeat');
    g.globalAlpha = Math.min(1, 0.95 * I);
    // layer A drifts slowly down and sideways, layer B rises; scrolling via translate keeps it cheap
    g.save();
    g.translate(APEX.x + t * 3, APEX.y + t * 7);
    g.scale(0.85, 1.35);
    g.fillStyle = pa;
    g.fillRect(-400, -200 - t * 7 / 1.35, 800, 900);
    g.restore();
    g.globalAlpha = Math.min(1, 0.4 * I);
    g.save();
    g.translate(APEX.x + 60 - t * 4, APEX.y - t * 11);
    g.scale(1.25, 2.0);
    g.fillStyle = pb;
    g.fillRect(-300, -60 + t * 11 / 2, 600, 500);
    g.restore();
    // pale wisps on top, slow sideways curl
    g.globalAlpha = Math.min(1, 0.35 * I);
    g.save();
    g.translate(APEX.x + Math.sin(t * 0.21) * 40 + t * 5, APEX.y - t * 5);
    g.scale(1.1, 1.7);
    g.fillStyle = pc;
    g.fillRect(-400, -80 + t * 5 / 1.7, 800, 600);
    g.restore();
    g.globalAlpha = 1;

    // darker in the core so the cone reads as a volume, edges hold the light
    g.globalCompositeOperation = 'multiply';
    const hg = g.createLinearGradient(BASE.l, 0, BASE.r, 0);
    hg.addColorStop(0, 'rgb(255,255,255)');
    hg.addColorStop(0.18, 'rgb(225,232,235)');
    hg.addColorStop(0.55, 'rgb(192,204,212)');
    hg.addColorStop(0.85, 'rgb(225,232,235)');
    hg.addColorStop(1, 'rgb(255,255,255)');
    g.fillStyle = hg;
    g.fillRect(BASE.l - 20, APEX.y, BASE.r - BASE.l + 40, BASE.y - APEX.y);

    // bright at the lamp, smoke pooling at the floor
    g.globalCompositeOperation = 'lighter';
    const vg = g.createLinearGradient(0, APEX.y, 0, BASE.y);
    vg.addColorStop(0, `rgba(190,255,250,${0.85 * I})`);
    vg.addColorStop(0.07, `rgba(80,215,210,${0.3 * I})`);
    vg.addColorStop(0.25, `rgba(40,150,155,${0.06 * I})`);
    vg.addColorStop(0.7, 'rgba(0,0,0,0)');
    vg.addColorStop(0.9, `rgba(50,170,170,${0.12 * I})`);
    vg.addColorStop(1, `rgba(110,235,225,${0.4 * I})`);
    g.fillStyle = vg;
    g.fillRect(BASE.l - 20, APEX.y, BASE.r - BASE.l + 40, BASE.y - APEX.y);

    // faint shafts fanning from the lamp, shimmering
    for (const r of rays) {
      g.globalAlpha = Math.min(1, I * (0.5 + 0.5 * Math.sin(t * r.sp + r.ph)));
      g.drawImage(r.c, RAYBOX.x, RAYBOX.y);
    }
    // dust motes drifting in the light
    for (const m of motes) {
      const v = ((m.v + t * m.sp) % 1 + 1) % 1;
      const u = m.u + Math.sin(t * 0.3 + m.ph) * 0.08;
      const [x, y] = conePt(poly, u, 0.08 + v * 0.9);
      const tw = 0.5 + 0.5 * Math.sin(t * 2.2 + m.ph * 3);
      g.globalAlpha = Math.min(1, 0.35 * tw * I);
      g.drawImage(glowDot, x - m.z, y - m.z, m.z * 2, m.z * 2);
    }
    g.globalAlpha = 1;
    g.restore();

    // glowing hard edges, flickering a touch
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    for (const [a, b, side] of [[poly[0], poly[3], 0], [poly[1], poly[2], 1]]) {
      const f = flick * (0.86 + 0.14 * Math.sin(t * 5.3 + side * 2) * Math.sin(t * 2.1 + side));
      for (const [w, al] of [[22, 0.03], [10, 0.06], [4, 0.2], [1.8, 0.55], [0.9, 0.95]]) {
        const sg = g.createLinearGradient(0, a[1], 0, b[1]);
        sg.addColorStop(0, `rgba(170,255,250,${Math.min(1, al * f * I * 1.4)})`);
        sg.addColorStop(0.5, `rgba(110,240,235,${al * f * I * 0.85})`);
        sg.addColorStop(1, `rgba(130,248,240,${al * f * I})`);
        g.strokeStyle = sg;
        g.lineWidth = w;
        g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.stroke();
      }
    }
    g.globalCompositeOperation = 'source-over';
  }

  function drawDisc(g, t, I) {
    const { x, y, r } = DISC;
    const body = g.createRadialGradient(x, y + r * 0.7, r * 0.05, x, y + r * 0.2, r);
    body.addColorStop(0, '#071423');
    body.addColorStop(0.5, '#040b18');
    body.addColorStop(1, '#020611');
    g.fillStyle = body;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    // faint concentric panel lines
    g.strokeStyle = 'rgba(60,120,140,0.12)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(x, y, r * 0.9, 0.2, Math.PI - 0.2); g.stroke();
    g.beginPath(); g.arc(x, y, r * 0.62, 0.35, Math.PI - 0.35); g.stroke();
    // teal rim brightening toward the bottom
    g.globalCompositeOperation = 'lighter';
    const rim = g.createLinearGradient(0, y, 0, y + r);
    rim.addColorStop(0, 'rgba(40,110,125,0.05)');
    rim.addColorStop(0.6, 'rgba(50,140,150,0.25)');
    rim.addColorStop(1, `rgba(120,230,230,${0.75 * Math.min(1, I)})`);
    for (const [w, a] of [[8, 0.15], [2.2, 1]]) {
      g.globalAlpha = a;
      g.strokeStyle = rim;
      g.lineWidth = w;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI); g.stroke();
    }
    // the lamp: a tiny hot point at the bottom of the disc
    const p = 0.92 + 0.08 * Math.sin(t * 4.1);
    g.globalAlpha = Math.min(1, I * p);
    g.drawImage(glowSoft, APEX.x - 90, APEX.y - 40, 180, 80);
    g.drawImage(glowCyan, APEX.x - 34, APEX.y - 26, 68, 52);
    g.drawImage(glowCyan, APEX.x - 10, APEX.y - 8, 20, 16);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  function drawStage(g, t, I) {
    const { x, y, rx, ry } = STAGE;
    // platform: a thin dark slab
    g.fillStyle = '#010409';
    g.beginPath();
    g.ellipse(x, y + 6, rx, ry, 0, 0, Math.PI);
    g.lineTo(x - rx, y);
    g.ellipse(x, y, rx, ry, 0, Math.PI, 0, true);
    g.closePath();
    g.fill();
    g.fillStyle = '#030a14';
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill();

    g.globalCompositeOperation = 'lighter';
    // rim, brightest nearest the beam
    const rim = g.createLinearGradient(x - rx, 0, x + rx, 0);
    rim.addColorStop(0, 'rgba(50,130,140,0.08)');
    rim.addColorStop(0.42, `rgba(90,210,210,${0.5 * I})`);
    rim.addColorStop(1, 'rgba(50,130,140,0.08)');
    g.strokeStyle = rim;
    g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(60,150,160,0.12)';
    g.beginPath(); g.ellipse(x, y + 6, rx, ry, 0, 0.05, Math.PI - 0.05); g.stroke();

    // reflection pool under the beam
    g.save();
    g.translate(BCX, y);
    g.scale(1, 0.085);
    const pool = g.createRadialGradient(0, 0, 0, 0, 0, 200);
    pool.addColorStop(0, `rgba(130,250,240,${0.8 * I})`);
    pool.addColorStop(0.35, `rgba(60,190,190,${0.4 * I})`);
    pool.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = pool;
    g.beginPath(); g.arc(0, 0, 200, 0, TAU); g.fill();
    g.restore();
    // bloom where the cone lands
    g.globalAlpha = Math.min(1, 0.35 * I);
    g.drawImage(glowSoft, BCX - 170, BASE.y - 40, 340, 70);
    g.globalAlpha = 1;

    // haze rolling along the floor at the beam's foot
    for (const w of wisps) {
      const u = ((w.x + t * w.sp) % 2 + 2) % 2 - 0.5;
      const wx = BASE.l - 40 + u * (BASE.r - BASE.l + 80);
      const wy = BASE.y - 8 - Math.abs(Math.sin(t * 0.4 + w.ph)) * 22;
      const a = 0.17 * I * (0.6 + 0.4 * Math.sin(t * 0.8 + w.ph)) * (1 - Math.abs(u - 0.5) * 1.3);
      if (a <= 0) continue;
      g.globalAlpha = Math.min(1, a);
      g.drawImage(glowSoft, wx - w.s, wy - w.s * 0.3, w.s * 2, w.s * 0.6);
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  // handwritten lyric, written on letter by letter then fading out
  function drawLyric(g, t) {
    const cycle = 16, k = t % cycle;
    const fade = 1 - CS.smooth(12.5, 14.5, k);
    if (fade <= 0) return;
    g.save();
    g.font = '48px "Reenie Beanie", "Segoe Print", "Comic Sans MS", cursive';
    g.textBaseline = 'alphabetic';
    const chars = [...lyric];
    let x = 975;
    const y = 742;
    const step = 0.16 * (22 / Math.max(10, chars.length));
    chars.forEach((ch, i) => {
      const appear = CS.smooth(0, 0.35, k * 1.1 - i * step);
      const wch = g.measureText(ch).width;
      if (appear > 0) {
        // a pen stroke lands slightly brighter, then settles
        const ink = 0.5 + 0.18 * (1 - CS.smooth(0.35, 1.4, k * 1.1 - i * step));
        g.fillStyle = `rgba(118,158,162,${ink * appear * fade})`;
        g.fillText(ch, x, y + Math.sin(i * 1.7) * 1.5 - i * 0.25);
      }
      x += wch + (ch === ' ' ? 30 : 8);
    });
    g.restore();
  }

  // Crowd member from behind: dark head + shoulders with sketchy rim strokes facing the stage.
  function drawFan(g, p, t) {
    const r = p.r;
    const x = p.x + Math.sin(t * p.f * 0.47 + p.ph * 1.7) * r * 0.08;
    const y = p.y + Math.sin(t * p.f + p.ph) * r * 0.04;
    const la = Math.atan2(LIGHT.y - y, LIGHT.x - x);
    const d = Math.hypot(LIGHT.x - x, (LIGHT.y - y) * 1.5);
    const lit = (0.85 * Math.exp(-d / 620) + 0.07) * p.lift;
    const sw = r * p.sh;

    // shoulders
    g.fillStyle = p.warm ? '#0a0605' : p.fill;
    g.beginPath();
    g.moveTo(x - sw, y + r * 4);
    g.bezierCurveTo(x - sw, y + r * 2.1, x - sw * 0.75, y + r * 1.45, x - r * 0.45, y + r * 1.3);
    g.lineTo(x + r * 0.45, y + r * 1.3);
    g.bezierCurveTo(x + sw * 0.75, y + r * 1.45, x + sw, y + r * 2.1, x + sw, y + r * 4);
    g.closePath();
    g.fill();
    // head (+ long hair / bun)
    const ax = p.ax;
    g.fillStyle = p.warm ? '#0c0504' : p.fill;
    g.beginPath();
    g.ellipse(x, y, r * ax, r, p.tilt, 0, TAU);
    if (p.hair > 0.68) g.ellipse(x, y + r * 0.6, r * (ax + 0.12), r * 1.05, 0, 0, TAU);
    else if (p.hair < 0.1) g.ellipse(x - r * 0.1, y - r * 0.86, r * 0.4, r * 0.34, 0, 0, TAU);
    g.fill();

    if (lit < 0.02) return;
    const col = p.warm ? '170,95,65' : '80,185,185';
    const j = p.jit;
    g.lineCap = 'round';
    g.strokeStyle = `rgba(${col},${Math.min(0.8, lit)})`;
    // rim on the side facing the stage, in two or three broken pen strokes
    const a0 = la - 0.95 - j[0] * 0.5, a1 = la + 0.75 + j[1] * 0.5;
    const segs = r > 14 ? 3 : r > 7 ? 2 : 1;
    g.lineWidth = Math.max(0.6, r * 0.032);
    for (let i = 0; i < segs; i++) {
      const u0 = i / segs, u1 = (i + 1) / segs - (i < segs - 1 ? 0.05 + j[(i + 2) % 5] * 0.08 : 0);
      const rr0 = 1 + (j[(i + 3) % 5] - 0.5) * 0.06;
      g.beginPath();
      g.ellipse(x, y, r * ax * rr0, r * rr0, p.tilt, a0 + (a1 - a0) * u0, a0 + (a1 - a0) * u1);
      g.stroke();
    }
    if (r > 10 && j[4] > 0.35) {
      // overdraw: a lighter second pass near the brightest point
      g.lineWidth = Math.max(0.5, r * 0.02);
      g.beginPath();
      g.ellipse(x + r * 0.03, y + r * 0.02, r * (ax + 0.05), r * 1.04, p.tilt, la - 0.45 - j[2] * 0.4, la + 0.15 + j[3] * 0.4);
      g.stroke();
    }
    // shoulder line on the side facing the light
    const sd = Math.cos(la) < 0 ? -1 : 1;
    g.globalAlpha = 0.75;
    g.lineWidth = Math.max(0.6, r * 0.028);
    g.beginPath();
    g.moveTo(x + sd * r * 0.5, y + r * 1.32);
    g.bezierCurveTo(x + sd * sw * 0.75, y + r * 1.47, x + sd * sw, y + r * 2.1, x + sd * sw * (0.98 + j[4] * 0.02), y + r * (2.6 + j[4] * 0.6));
    g.stroke();
    if (p.warm) {
      // a few warm strands in the hair
      g.globalAlpha = 0.5;
      g.lineWidth = Math.max(0.6, r * 0.02);
      for (let i = 0; i < 4; i++) {
        const a0 = la - 0.6 + i * 0.35;
        g.beginPath();
        g.moveTo(x + Math.cos(a0) * r * 0.55, y + Math.sin(a0) * r * 0.7);
        g.quadraticCurveTo(x + Math.cos(a0) * r * 0.8, y + r * 0.6, x + Math.cos(a0) * r * 0.75, y + r * 1.25);
        g.stroke();
      }
    }
    g.globalAlpha = 1;
  }

  function render(g, S) {
    const tL = S.clocks.lights, tA = S.clocks.audience, tP = S.clocks.performer, tY = S.clocks.lyric;
    const I = S.intensity;
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.drawImage(bg, 0, 0);

    drawBeam(g, tL, I);
    drawDisc(g, tL, I);
    drawStage(g, tL, I);
    CS.drawPerformer(g, PERF.x, PERF.y, PERF.s, tP, S.bpm, 'sketch');

    // the beam's light wrapping the performer
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = Math.min(1, 0.16 * I);
    g.drawImage(glowSoft, PERF.x - 80, PERF.y - 200, 160, 140);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';

    g.drawImage(farCrowd, 0, FARY);
    drawCrowd(g, tA);

    g.drawImage(overlay, 0, 0);
  }

  function extraUI(ui, S, el) {
    const lab = el('label', {}, 'Lyric ');
    const inp = el('input', { type: 'text', value: lyric });
    inp.oninput = () => (lyric = inp.value);
    lab.append(inp);
    ui.append(lab);
  }

  // Thin pen work (lyric, performer outline) stays crisp above the paint pass.
  function renderTop(g, S) {
    g.globalAlpha = 0.85;
    CS.drawPerformer(g, PERF.x, PERF.y, PERF.s, S.clocks.performer, S.bpm, 'sketch');
    g.globalAlpha = 1;
    // offset so the line starts writing itself half a second after load
    drawLyric(g, S.clocks.lyric + 15.5);
    // the crowd again, crisp, over its painted copy so the rim strokes survive the paint pass
    const cl = crowdLayer.getContext('2d');
    cl.clearRect(0, 0, W, H);
    drawCrowd(cl, S.clocks.audience);
    g.globalAlpha = 0.6;
    g.drawImage(crowdLayer, 0, 0);
    g.globalAlpha = 1;
  }

  const start = () => CS.run({
    W, H, bpm: 72, file: 'still-standing', toggles: ['performer', 'lights', 'audience', 'lyric'],
    paint: { radius: 5, wobble: 2 }, init, render, renderTop, extraUI,
  });
  // wait briefly for the handwriting font so the first frames don't flash a fallback
  Promise.race([document.fonts.load('48px "Reenie Beanie"'), new Promise(r => setTimeout(r, 1500))]).then(start, start);
})();
</script>
</body>
</html>
